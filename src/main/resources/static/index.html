<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1d513a">
  <title>Poker Kittens</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page-shell">
    <section class="brand-panel" aria-label="Poker Kittens">
      <div class="brand-mark" aria-hidden="true"><span>K</span><span>P</span></div>
      <p class="eyebrow">Private poker club</p>
      <h1>Poker<br><em>Kittens</em></h1>
      <p class="brand-copy">Соберите свою игру. За столом всегда найдется место для еще одного игрока.</p>
    </section>

    <section class="auth-panel" aria-labelledby="auth-title">
      <div class="auth-content">
        <p class="eyebrow">Welcome to the table</p>
        <h2 id="auth-title">Войти в игру</h2>
        <p class="auth-subtitle" id="auth-subtitle">Введите данные своего аккаунта.</p>

        <div class="mode-switch" role="tablist" aria-label="Режим авторизации">
          <button class="mode-button active" type="button" role="tab" aria-selected="true" data-mode="login">Вход</button>
          <button class="mode-button" type="button" role="tab" aria-selected="false" data-mode="register">Регистрация</button>
        </div>

        <form id="auth-form" novalidate>
          <label for="username">Имя игрока</label>
          <input id="username" name="username" type="text" autocomplete="username" placeholder="например, kitten_ace" required>

          <label for="password">Пароль</label>
          <div class="password-field">
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Ваш пароль" required>
            <button class="password-toggle" id="password-toggle" type="button" aria-label="Показать пароль">Показать</button>
          </div>
          <p class="field-hint" id="password-hint">Минимум 8 символов.</p>

          <div class="form-message" id="form-message" role="alert" aria-live="polite"></div>
          <button class="submit-button" id="submit-button" type="submit">Войти</button>
        </form>
        <p class="footer-note">Игра начинается с хорошей руки.</p>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
