spring:
  application:
    name: kittens-poker

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kittens_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  jpa:
    # Print every SQL query generated by Hibernate to the console.
    #
    # Useful during development because you can see exactly what Hibernate
    # sends to the database (SELECT, INSERT, UPDATE, DELETE).
    #
    # Example:
    #   select u.id, u.username from users u where u.id = ?
    #
    # Usually enabled only in development.
    show-sql: true
    hibernate:
      # Controls how Hibernate manages the database schema at application startup.
      #
      # Available options:
      #
      # none
      #   Do nothing. Hibernate will neither validate nor modify the database.
      #
      # validate
      #   Check that the database schema matches your entities.
      #   If something is missing or different, the application fails to start.
      #
      # update
      #   Automatically create missing tables, columns and constraints.
      #   Existing data is preserved whenever possible.
      #
      # create
      #   Drop the entire schema and recreate it every time the application starts.
      #   ALL DATA IS LOST.
      #
      # create-drop
      #   Same as "create", but also drops the schema when the application stops.
      #   Mainly useful for tests.
      #
      # Recommended:
      #   Development -> update
      #   Testing     -> create-drop
      #   Production  -> validate (or use Flyway/Liquibase migrations)
      ddl-auto: update
    properties:
      hibernate:
        # Pretty-print generated SQL.
        #
        # Without this option:
        #
        # select u1_0.id,u1_0.username,u1_0.password from users u1_0 where u1_0.id=?
        #
        # With this option:
        #
        # select
        #     u1_0.id,
        #     u1_0.username,
        #     u1_0.password
        # from
        #     users u1_0
        # where
        #     u1_0.id = ?
        #
        # Makes debugging much easier.
        format_sql: true

server:
  port: 8080

app:
  security:
    jwt:
      secret-base64: ${APP_JWT_SECRET_BASE64}
      issuer: kittens-poker
      access-token-ttl: 15m

rating:
  glicko:
    classic:
      defaultRating: 1500
      defaultRD: 350
